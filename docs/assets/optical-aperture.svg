  <g transform="rotate(-18 460 245)">
    <ellipse cx="480" cy="245" rx="119" ry="173" fill="#06070b" stroke="#202740" stroke-width="1"/>
    <ellipse cx="460" cy="245" rx="111" ry="170" fill="url(#lens)" stroke="url(#rim)" stroke-width="20"/>
    <ellipse cx="460" cy="245" rx="99" ry="158" fill="none" stroke="#627bff" stroke-opacity=".3" stroke-width="1"/>
    <ellipse cx="460" cy="245" rx="124" ry="184" fill="none" stroke="#344374" stroke-opacity=".35" stroke-width="1" stroke-dasharray="58 12 3 12"/>
    <path d="M460 48v18 M460 424v18 M326 245h15 M579 245h16" stroke="#6a80c0" stroke-opacity=".45"/>
    <path d="M445 245h30 M460 230v30" stroke="#8198f5" stroke-opacity=".45" stroke-width=".8"/>
  </g>
  <path d="M15 246H460" fill="none" stroke="url(#beam)" stroke-width="1.3"/>
  <circle cx="460" cy="246" r="2" fill="#a5baff" opacity=".8"/>
