<svg xmlns="http://www.w3.org/2000/svg" width="650" height="480" viewBox="0 0 650 480">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060710"/><stop offset=".2" stop-color="#111a64"/>
      <stop offset=".31" stop-color="#304be5"/><stop offset=".33" stop-color="#9daaff"/>
      <stop offset=".36" stop-color="#182bb0"/><stop offset=".58" stop-color="#070b24"/>
      <stop offset=".79" stop-color="#18258b"/><stop offset=".86" stop-color="#3e5eff"/>
      <stop offset="1" stop-color="#090c28"/>
    </linearGradient>
    <radialGradient id="lens" cx=".7" cy=".2" r=".8">
      <stop stop-color="#3148bc" stop-opacity=".18"/><stop offset=".5" stop-color="#0a1234" stop-opacity=".18"/><stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="15" y1="246" x2="460" y2="246"><stop stop-color="#2d4fff" stop-opacity="0"/><stop offset=".75" stop-color="#3c5cff" stop-opacity=".3"/><stop offset="1" stop-color="#a2b5ff" stop-opacity=".85"/></linearGradient>
    <linearGradient id="cone"><stop stop-color="#2639cc" stop-opacity="0"/><stop offset="1" stop-color="#3550ed" stop-opacity=".08"/></linearGradient>
  </defs>
  <!-- A beam converges on an angled receiver aperture. Decorative, not a schematic. -->
